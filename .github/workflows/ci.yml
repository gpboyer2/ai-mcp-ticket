name: CI

# 为什么要有这个：README 上挂着 CI badge，没有 CI 那个 badge 就是空口无凭。
# 触发面覆盖默认分支 dev 与开发分支 feat-v1.0，外加所有 PR —— 任何一条进来都要过测试。

on:
  push:
    branches: [dev, feat-v1.0]
  pull_request:
    branches: [dev, feat-v1.0]
  workflow_dispatch:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines 要求 >=22；22 是下限（必须验），24 是当前 LTS 线（防未来踩坑）。
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      # 版本由 package.json 的 packageManager 字段决定，CI 与本地装出同一个 pnpm。
      # 必须排在 setup-node 前面：下面 cache: pnpm 要靠 PATH 里已有 pnpm 才能定位缓存目录。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # 用 --frozen-lockfile 而不是 install：锁文件怎么写的就怎么装，CI 里不允许悄悄改依赖树。
      # better-sqlite3 是原生模块，构建白名单写在 pnpm-workspace.yaml 的 allowBuilds 里，
      # 它自带 linux-x64 的 prebuild，所以这里不需要编译工具链。
      - name: Install
        run: pnpm install --frozen-lockfile

      # 测试全部用 node:test，每个测试文件自己 listen(0) 拿随机端口、自己建临时目录与临时库，
      # 互不干扰，也不占用任何固定端口 —— 所以这里不需要起服务、不需要配 DSH_HOME。
      - name: Test
        run: pnpm test
